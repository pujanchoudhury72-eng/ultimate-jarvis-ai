name: Build Ultimate JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Ultimate-JARVIS-Android-Source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android source
        run: |
          test -f Ultimate-JARVIS-Android-Source.zip
          mkdir android-source
          unzip -q Ultimate-JARVIS-Android-Source.zip -d android-source

      - name: Build debug APK
        working-directory: android-source
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-JARVIS-debug-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7￼Enter
